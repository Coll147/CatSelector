<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="https://sillycat.wiki/favicon.ico" />
    <script type="module" src="./src/main.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>The CAT Selector</title>
  </head>
  <body>
    <header>
      <h1>The cat bazinger</h1>
    </header>
    <div class="main_wrapper">
      <main class="card_wrapper" id="cat_list">
        <select name="cats" id="cats_selector">
          <option disabled selected>-- Select your CAT --</option>
        </select>

      </main>
      <aside id="cat_info">
        <h4 class="cat_info__badge" id="cat_info__category">Categoría del gato</h4>
        <h4 class="cat_info__badge" id="cat_info__special">Habilidad especial</h4>

        <h2 id="cat_info__title">Selecciona un gato</h2>
        <div id="cat_info__img-wrap">
          <iframe id="cat_info__video"
            width="560"
            height="315"
            src="https://www.youtube.com/embed/yDHCTvEyEuM?autoplay=1"
            title="Reproductor de YouTube"
            allow="autoplay; encrypted-media; picture-in-picture"
            allowfullscreen
          ></iframe>
        </div>

        <p id="cat_info__description">Un texto que mola mogollón</p>

      </aside>
    </div>
    <footer>

    </footer>

  </body>
</html>
