<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script type="module" src="./src/main.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>The CAT Selector</title>
  </head>
  <body>
    <div class="app">
      <header class="header">
        <h1 class="titulo">Título de la pantalla</h1>
        <div class="slot-extra">
          <!-- Hueco reservado para poner ALGO (filtros, contador, texto, etc.) -->
        </div>
      </header>

      <main class="stage">
        <button class="nav-btn nav-btn--prev" aria-label="Anterior">&lt;</button>

        <div class="cards-track">
          <article class="card card--side card--left">Tarjeta izq.</article>
          <article class="card card--active">Tarjeta centro</article>
          <article class="card card--side card--right">Tarjeta der.</article>
        </div>

        <button class="nav-btn nav-btn--next" aria-label="Siguiente">&gt;</button>
      </main>

      <footer class="footer">
        <span>Footer</span>
      </footer>
    </div>
  </body>
</html>
